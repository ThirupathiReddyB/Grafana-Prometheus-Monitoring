version: '3.8'

services:
  loki:
    image: grafana/loki:3.4.1
    container_name: loki_container
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring-network

networks:
  monitoring-network:
    external: true
