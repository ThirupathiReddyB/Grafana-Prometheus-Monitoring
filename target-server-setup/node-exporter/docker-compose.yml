version: '3.8'

services:
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - ./logs:/var/log/node-exporter
    networks:
      - monitoring-network

networks:
  monitoring-network:
    external: true
